# compose-launcher config for CppConsoleAnimation (https://github.com/Nate314/CppConsoleAnimation)
# The launcher requires at least one port line, but this console program serves nothing.
# UNUSED_PORT only satisfies that rule: docker-compose.yml does not read it and publishes no ports.
port UNUSED_PORT 8080

url Watch: .\run.ps1 run --rm animation   or   ./run.sh run --rm animation   (type 1 or 2, Ctrl+C to stop; use a terminal at least 200x60)
url Or attach to the started container: .\run.ps1 attach animation   or   ./run.sh attach animation   (Ctrl+P Ctrl+Q detaches)
